<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parkcraft</title>
    <meta name="description" content="Configurateur 3D de parcs aquatiques gonflables : conception, devis et génération automatique de parcs cohérents." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport" class="viewport"></div>

    <!-- barre supérieure -->
    <header class="topbar glass">
      <div class="brand"><span class="brand-mark"></span><span class="brand-name" id="brand-name"></span></div>
      <span class="divider"></span>
      <input id="project-name" class="project-name" aria-label="Nom du projet" spellcheck="false" />
      <div class="spacer"></div>
      <div class="group" id="top-actions"></div>
      <div class="gen-group">
        <button class="btn-generate" data-action="random" title="Générer un parc cohérent (G)"></button>
        <button class="icon-btn" data-action="gen-settings" title="Réglages du générateur"></button>
      </div>
    </header>

    <!-- barre d'outils verticale -->
    <nav class="toolrail glass" id="toolrail"></nav>

    <!-- panneaux latéraux (un seul ouvert à la fois) -->
    <section class="flyout glass" id="flyout" hidden></section>

    <!-- catalogue plein format -->
    <section class="catalog glass" id="catalog" hidden>
      <div class="catalog-head">
        <h2>Catalogue</h2>
        <div class="search-wrap"><span class="search-ico"></span><input id="search" placeholder="Rechercher un module" spellcheck="false" /></div>
        <label class="toggle-fit"><input type="checkbox" id="fit-site" /> Compatibles avec le site</label>
        <button class="icon-btn" id="catalog-close" title="Fermer (C)"></button>
      </div>
      <div class="cat-tabs" id="cat-tabs"></div>
      <div class="catalog-grid" id="catalog-grid"></div>
    </section>

    <!-- barre rapide (derniers modules utilisés) -->
    <div class="hotbar glass" id="hotbar"></div>

    <!-- tableau de bord -->
    <aside class="hud glass" id="hud"></aside>
    <aside class="inspector glass" id="inspector" hidden></aside>

    <div class="tooltip" id="tooltip" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="menu glass" id="export-menu" hidden></div>

    <dialog id="gen-dialog" class="dialog"></dialog>
    <dialog id="start-dialog" class="dialog"></dialog>
    <input type="file" id="file-input" accept=".json,application/json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
